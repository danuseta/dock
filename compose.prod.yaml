name: dock

services:
  dock-app:
    image: ghcr.io/danuseta/dock:${DOCK_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3101:4000"
    environment:
      PORT: 4000
      DOCK_MODE: laptop
      FRONTEND_DIST_PATH: /app/frontend-dist
      DATABASE_URL: file:/app/data/jidis.db
      JIDIS_DATA_DIR: /app/data
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      CORS_ORIGIN: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL must be set}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL must be set}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      TRUST_PROXY: "true"
      DOCK_PIN_MODE: ${DOCK_PIN_MODE:-always}
      DOCKER_API_URL: http://docker-proxy:2375
      BRAIN_SERVICE_URL: ${BRAIN_SERVICE_URL:-}
      BRAIN_INTERNAL_SECRET: ${BRAIN_INTERNAL_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - dock_data:/app/data
    networks:
      - default
      - docker-inventory
      - brain
    mem_limit: 384m
    cpus: 0.75
    security_opt:
      - no-new-privileges:true

  docker-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      POST: 0
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-inventory
    security_opt:
      - no-new-privileges:true

volumes:
  dock_data:
    name: dock_dock_data

networks:
  docker-inventory:
    internal: true
  brain:
    name: dock_brain
    internal: true
