name: dock

services:
  dock-app:
    image: ghcr.io/danuseta/dock:${DOCK_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3101:4000"
    environment:
      PORT: 4000
      FRONTEND_DIST_PATH: /app/frontend-dist
      DATABASE_URL: file:/app/data/jidis.db
      JIDIS_DATA_DIR: /app/data
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      CORS_ORIGIN: ${PUBLIC_BASE_URL:-http://localhost:3101}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3101}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - dock_data:/app/data
    mem_limit: 384m
    cpus: 0.75
    security_opt:
      - no-new-privileges:true

volumes:
  dock_data:
